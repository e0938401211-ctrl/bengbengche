<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="蹦蹦車"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}*{-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}</style></head><body><title>蹦蹦車 司機端</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="蹦蹦車">
<meta name="theme-color" content="#E4E8E1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one-screen phone app — map fills the screen, action sheet floats above a bottom tab bar. Single committed light look. */
:root {
  --ink: #121A17; --grey: #5B6560; --line: #DDE2DC; --ground: #E4E8E1; --page: #F6F7F4; --white: #FFFFFF;
  --pink: #D12A6E; --orange: #E8590C; --yellow: #FFC93C; --green: #1F8A3A; --teal: #0E8A9E; --blue: #2459D6; --purple: #7B3FD1;
  --park: #CDE2CC; --water: #BFD7E6; --dim: #C9D2CD;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; cursor: pointer; border: none; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; background: var(--ground); }

/* map */
.map { position: absolute; inset: 0; }
.m { position: absolute; }
.road-h { left: 0; right: 0; height: 10px; background: var(--white); }
.road-v { top: 0; bottom: 0; width: 8px; background: var(--white); }
.lbl { font-size: 11px; color: var(--grey); }
.car { width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: var(--white); display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.route[hidden] { display: none !important; }

/* top bar */
.top { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: 14px; display: flex; align-items: center; justify-content: space-between; }
.round { width: 44px; height: 44px; border-radius: 50%; background: var(--white); display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.round.flat { background: var(--ground); box-shadow: none; }
.pill { height: 44px; padding: 0 18px; border-radius: 22px; background: var(--purple); color: var(--white); display: flex; align-items: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

/* sheet */
.sheet { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.card { background: var(--white); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -2px 16px rgba(0,0,0,.1); }
.card.center { align-items: center; text-align: center; }
.h2 { font-size: 20px; font-weight: 700; margin: 0; }
.sub { font-size: 14px; color: var(--grey); margin: 0; }
.kicker { font-size: 13px; color: var(--grey); font-weight: 500; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.track { height: 4px; border-radius: 2px; background: var(--ground); overflow: hidden; }
.fill { height: 4px; border-radius: 2px; }
.searching .fill { width: 40%; background: var(--blue); animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
@media (prefers-reduced-motion: reduce) { .searching .fill { animation: none; } }

.online { width: 96px; height: 96px; border-radius: 50%; border: 6px solid var(--white); background: var(--pink); color: var(--white); font-size: 22px; font-weight: 900; box-shadow: 0 6px 18px rgba(209,42,110,.4); }
.offline-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.offline-wrap .card { align-self: stretch; }
.btn { height: 56px; border-radius: 28px; color: var(--white); font-size: 18px; font-weight: 700; width: 100%; }
.outline { height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid var(--ink); background: var(--white); color: var(--ink); font-size: 15px; font-weight: 700; flex-shrink: 0; }
.btn:active, .online:active { opacity: .85; }

.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: conic-gradient(var(--pink) 0 25%, var(--orange) 0 50%, var(--yellow) 0 75%, var(--blue) 0); }
.word { font-size: 26px; font-weight: 900; letter-spacing: 1px; }

.req { background: var(--ink); color: var(--white); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.3); margin: 0 -4px; }
.chip { height: 28px; padding: 0 12px; border-radius: 14px; background: var(--yellow); color: var(--ink); font-size: 13px; font-weight: 700; display: flex; align-items: center; }
.dim { color: var(--dim); font-size: 15px; }
.fare { font-size: 40px; font-weight: 900; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.stop { display: flex; gap: 12px; align-items: flex-start; }
.dot { width: 10px; height: 10px; margin-top: 7px; flex-shrink: 0; }
.decline { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--grey); background: transparent; display: grid; place-items: center; flex-shrink: 0; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--ground); display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
.check { width: 52px; height: 52px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }

/* earnings */
.earn { position: absolute; inset: 0; background: var(--page); overflow-y: auto; padding-block: 24px calc(110px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.panel { background: var(--white); border-radius: 20px; padding: 16px; }
.chart { height: 160px; display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--line); }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; }
.bar span { font-size: 10px; color: var(--grey); font-variant-numeric: tabular-nums; }
.bar i { display: block; width: 100%; border-radius: 6px 6px 0 0; }
.days { display: flex; gap: 8px; margin-top: 8px; }
.days span { flex: 1; text-align: center; font-size: 12px; color: var(--grey); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--white); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.stat b { font-size: 24px; font-variant-numeric: tabular-nums; }
.line { display: flex; justify-content: space-between; padding: 14px 0; font-size: 15px; border-bottom: 1px solid #EEF0EC; }
.line:last-child { border-bottom: none; }
.line b { font-weight: 500; font-variant-numeric: tabular-nums; }

/* tab bar */
.tabs { position: absolute; left: 0; right: 0; bottom: 0; background: var(--white); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { flex: 1; height: 68px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--grey); }
.tab[aria-selected="true"] { color: var(--pink); }

/* auth */
.auth { position: absolute; inset: 0; z-index: 20; background: var(--page); overflow-y: auto; padding-block: 28px 40px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--ground); border-radius: 14px; padding: 4px; }
.seg button { height: 44px; border-radius: 10px; background: transparent; font-size: 16px; font-weight: 700; color: var(--grey); }
.seg button[aria-selected="true"] { background: var(--white); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.form { display: flex; flex-direction: column; gap: 14px; }
.form[hidden] { display: none !important; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 500; }
.field input, .field select { height: 50px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit; background: var(--white); color: var(--ink); width: 100%; box-sizing: border-box; }
.field input:focus, .field select:focus { outline: none; border-color: var(--blue); }
.err { color: #B3261E; font-size: 14px; min-height: 20px; margin: 0; }
.hint { font-size: 12px; color: var(--grey); margin: 0; line-height: 1.6; }
/* chat */
.chat { position: absolute; inset: 0; z-index: 16; background: var(--page); display: flex; flex-direction: column; }
.chat[hidden] { display: none !important; }
.chat-head { display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--white); border-bottom: 1px solid var(--line); }
.msgs { flex: 1; overflow-y: auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 16px; line-height: 1.45; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--blue); color: var(--white); border-bottom-right-radius: 6px; }
.msg.them { align-self: flex-start; background: var(--white); color: var(--ink); border-bottom-left-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.quick { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.quick button { flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 19px; background: var(--white); border: 1.5px solid var(--line); font-size: 14px; color: var(--ink); }
.compose { display: flex; gap: 8px; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.compose input { flex: 1; min-width: 0; height: 46px; border-radius: 23px; border: 1.5px solid var(--line); padding: 0 16px; font-size: 16px; font-family: inherit; background: var(--white); color: var(--ink); }
.compose input:focus { outline: none; border-color: var(--blue); }
.send { width: 46px; height: 46px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; flex-shrink: 0; }
.voice { height: 38px; padding: 0 12px; border-radius: 19px; background: var(--ground); font-size: 13px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.voice[aria-pressed="true"] { background: var(--pink); color: var(--white); }
.badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: var(--pink); color: var(--white); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* location */
.locchip { position: absolute; top: 68px; left: 50%; transform: translateX(-50%); height: 38px; padding: 0 14px; border-radius: 19px; background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,.12); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.area-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-height: 52vh; overflow-y: auto; padding-bottom: 4px; }
.area-grid button { height: 44px; border-radius: 12px; background: var(--ground); font-size: 15px; font-weight: 500; color: var(--ink); }
.area-grid button.all { grid-column: 1 / -1; font-weight: 700; }
.area-grid button[aria-pressed="true"] { background: var(--pink); color: var(--white); }
/* taxi meter */
.meter { background: var(--ink); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.meter-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--dim); letter-spacing: .08em; }
.meter-fare { color: var(--yellow); font-size: 44px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
.meter-sub { color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
.meter-rate { color: var(--dim); font-size: 11px; opacity: .85; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--yellow); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
.overlay { position: absolute; inset: 0; z-index: 15; background: rgba(18,26,23,.45); display: flex; align-items: flex-end; }
.psheet { width: 100%; background: var(--white); border-radius: 24px 24px 0 0; padding-block: 24px calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 6px; }
</style>

<div class="app">
  <section id="home">
    <div class="map" aria-hidden="true">
      <div class="m" style="left:30px;top:150px;width:120px;height:90px;background:var(--park);border-radius:10px"></div>
      <div class="m" style="right:30px;top:420px;width:110px;height:130px;background:var(--park);border-radius:10px"></div>
      <div class="m" style="left:-20px;top:520px;width:220px;height:46px;background:var(--water);transform:rotate(-12deg)"></div>
      <div class="m road-h" style="top:270px;height:14px"></div>
      <div class="m road-h" style="top:400px"></div>
      <div class="m road-h" style="top:600px"></div>
      <div class="m road-v" style="left:46%;width:14px"></div>
      <div class="m road-v" style="left:18%"></div>
      <div class="m road-v" style="left:77%"></div>
      <div class="m lbl" id="mapLbl1" style="left:52%;top:254px"></div>
      <div class="m lbl" id="mapLbl2" style="left:21%;top:386px"></div>
      <div class="route" id="route" hidden>
        <div class="m" style="left:calc(46% + 4px);top:284px;width:6px;height:120px;background:var(--blue);border-radius:3px"></div>
        <div class="m" style="left:calc(46% + 4px);top:400px;width:31%;height:6px;background:var(--blue);border-radius:3px"></div>
        <div class="m" style="left:calc(77% - 10px);top:389px;width:28px;height:28px;border-radius:50%;background:var(--pink);border:4px solid var(--white);box-sizing:border-box"></div>
      </div>
      <div class="m car" style="left:calc(46% + 7px);top:257px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#D12A6E"><path d="M12 2l7 19-7-4-7 4z"/></svg>
      </div>
    </div>

    <div class="top">
      <button class="round" id="profileBtn" aria-label="個人檔案"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121A17" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
      <div class="pill" id="pill">NT$ 0</div>
      <button class="round" aria-label="安全工具"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121A17" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg></button>
    </div>

    <button class="locchip" id="locBtn" aria-label="更改所在區域">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D12A6E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span id="locText">高雄市</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B6560" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="sheet" id="sheet" aria-live="polite"></div>
  </section>

  <section class="earn" id="earn" hidden></section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-home" aria-selected="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>首頁
    </button>
    <button class="tab" role="tab" id="tab-earn" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>收入
    </button>
  </nav>

  <section class="auth" id="auth" hidden>
    <div id="authLogo" style="display:flex;justify-content:center;margin-top:8px"></div>
    <p class="sub" style="text-align:center;margin-top:-10px">司機專用帳號</p>
    <div class="seg" role="tablist">
      <button role="tab" id="seg-reg" aria-selected="true">註冊</button>
      <button role="tab" id="seg-login" aria-selected="false">登入</button>
    </div>
    <form class="form" id="regForm" novalidate>
      <div class="field"><label for="reg-name">姓名</label><input id="reg-name" autocomplete="name" placeholder="王小明"></div>
      <div class="field"><label for="reg-phone">手機號碼</label><input id="reg-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0912345678"></div>
      <div class="field"><label for="reg-plate">車牌號碼</label><input id="reg-plate" autocapitalize="characters" placeholder="ABC-1234"></div>
      <div class="field"><label for="reg-brand">廠牌</label><select id="reg-brand"><option value="">請選擇廠牌</option></select></div>
      <div class="field"><label for="reg-model">車型</label><select id="reg-model" disabled><option value="">請先選擇廠牌</option></select></div>
      <div class="field" id="reg-other-wrap" hidden><label for="reg-other">輸入車型</label><input id="reg-other" placeholder="例如 Corolla Altis"></div>
      <div class="field"><label for="reg-color">車身顏色</label><select id="reg-color"><option>白色</option><option>黑色</option><option>銀色</option><option>灰色</option><option>黃色</option><option>藍色</option><option>紅色</option><option>其他顏色</option></select></div>
      <div class="field"><label for="reg-seats">座位數</label><select id="reg-seats"><option>5 人座</option><option>7 人座</option><option>8 人座以上</option></select></div>
      <div class="field"><label for="reg-fuel">動力</label><select id="reg-fuel"><option>汽油</option><option>油電混合</option><option>插電式油電</option><option>純電動</option><option>柴油</option></select></div>
      <div class="field"><label for="reg-service">服務類型</label><select id="reg-service"><option>蹦蹦車標準</option><option>蹦蹦車舒適</option><option>蹦蹦車大型（6 人以上）</option><option>蹦蹦車綠能（電動車）</option><option>蹦蹦車無障礙</option></select></div>
      <div class="field"><label for="reg-pw">密碼（至少 6 碼）</label><input id="reg-pw" type="password" autocomplete="new-password"></div>
      <div class="field"><label for="reg-pw2">再次輸入密碼</label><input id="reg-pw2" type="password" autocomplete="new-password"></div>
      <p class="err" id="regErr" role="alert"></p>
      <button class="btn" type="submit" style="background:var(--pink)">建立帳號</button>
    </form>
    <form class="form" id="loginForm" novalidate hidden>
      <div class="field"><label for="login-phone">手機號碼</label><input id="login-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0912345678"></div>
      <div class="field"><label for="login-pw">密碼</label><input id="login-pw" type="password" autocomplete="current-password"></div>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn" type="submit" style="background:var(--blue)">登入</button>
    </form>
    <p class="hint">測試版：帳號只存在這支手機的瀏覽器裡，換手機或清除 Safari 資料就要重新註冊。請不要用你其他地方的常用密碼。</p>
  </section>

  <section class="chat" id="chat" hidden aria-label="和乘客聊天">
    <div class="chat-head">

  <div class="overlay" id="areaPick" hidden>

        <button class="round flat" id="areaClose" aria-label="關閉"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121A17" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <p class="sub" style="margin-top:-6px">派單會優先從你所在的區域出發。高雄市共 38 區。</p>

  </div>

  <div class="overlay" id="profile" hidden>
    <div class="psheet" role="dialog" aria-label="個人檔案">
      <div class="row" style="margin-bottom:6px"><p class="h2" id="pfName"></p>
        <button class="round flat" id="pfClose" aria-label="關閉"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121A17" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="line"><span>手機號碼</span><b id="pfPhone"></b></div>
      <div class="line"><span>車牌號碼</span><b id="pfPlate"></b></div>
      <div class="line"><span>車輛</span><b id="pfCar"></b></div>
      <div class="line"><span>規格</span><b id="pfSpec"></b></div>
      <div class="line"><span>服務類型</span><b id="pfType"></b></div>
      <button class="btn" id="logout" style="background:var(--ink);margin-top:10px">登出</button>
    </div>
  </div>
</div>

<script>
const RIDES = [
  { type: '蹦蹦車標準', fare: 185, rating: '4.92', pickupMin: 4, pickupKm: '1.2', from: '中西區 民族路二段 赤崁樓前', to: '東區 大學路 成大光復校區', tripMin: 14, tripKm: '4.6', rider: '陳小姐' },
  { type: '蹦蹦車舒適', fare: 320, rating: '4.85', pickupMin: 6, pickupKm: '2.0', from: '中西區 海安路二段', to: '台南高鐵站', tripMin: 28, tripKm: '15.3', rider: '林先生' },
  { type: '蹦蹦車標準', fare: 140, rating: '4.97', pickupMin: 3, pickupKm: '0.8', from: '北區 西門路三段 花園夜市', to: '中西區 南門路 孔廟', tripMin: 11, tripKm: '3.4', rider: '王小姐' }
];
const PAST = [1820, 960, 1340, 2450, 3100, 2780], PAST_TRIPS = 61, SECS = 15;
const DAYS = ['週二', '週三', '週四', '週五', '週六', '週日', '今天'];
const RAINBOW = ['#D12A6E', '#E8590C', '#E0A500', '#1F8A3A', '#0E8A9E', '#2459D6', '#7B3FD1'];
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

// 台灣市場常見廠牌與車型（含常見的老車款）
const CARS = {
  'Toyota 豐田': ['Corolla Altis', 'Corolla Cross', 'Camry', 'Prius', 'Prius PHV', 'RAV4', 'Yaris', 'Yaris Cross', 'Vios', 'Sienta', 'Sienna', 'Alphard', 'Town Ace', 'bZ4X', 'Wish', 'Previa'],
  'Lexus 凌志': ['ES', 'IS', 'LS', 'UX', 'NX', 'RX', 'LBX', 'LM'],
  'Honda 本田': ['Fit', 'City', 'Civic', 'Accord', 'HR-V', 'CR-V', 'Odyssey'],
  'Nissan 日產': ['Sentra', 'Tiida', 'Teana', 'Kicks', 'X-Trail', 'Livina', 'Serena', 'Leaf'],
  'Mitsubishi 三菱': ['Colt Plus', 'Eclipse Cross', 'Outlander', 'Zinger', 'Grand Lancer'],
  'CMC 中華': ['Veryca 菱利', 'Delica 得利卡'],
  'Mazda 馬自達': ['Mazda2', 'Mazda3', 'Mazda6', 'CX-3', 'CX-30', 'CX-5', 'CX-60', 'CX-9'],
  'Subaru 速霸陸': ['Impreza', 'XV', 'Crosstrek', 'Forester', 'Outback', 'Levorg'],
  'Suzuki 鈴木': ['Swift', 'Ignis', 'Vitara', 'S-Cross', 'Jimny'],
  'Hyundai 現代': ['Elantra', 'Venue', 'Kona', 'Tucson L', 'Santa Fe', 'Custin', 'Staria', 'Ioniq 5', 'Ioniq 6'],
  'Kia 起亞': ['Picanto', 'Stonic', 'Niro', 'Sportage', 'Sorento', 'Carnival', 'EV6', 'EV9'],
  'Ford 福特': ['Fiesta', 'Focus', 'Kuga', 'Ranger', 'Tourneo Connect', 'Tourneo Custom', 'Mustang Mach-E'],
  'Volkswagen 福斯': ['Polo', 'Golf', 'T-Cross', 'T-Roc', 'Tiguan', 'Touran', 'Caddy', 'Multivan', 'ID.4'],
  'Škoda': ['Fabia', 'Scala', 'Kamiq', 'Karoq', 'Octavia', 'Superb', 'Kodiaq', 'Enyaq'],
  'Audi 奧迪': ['A3', 'A4', 'A6', 'Q2', 'Q3', 'Q5', 'Q7', 'Q8 e-tron'],
  'BMW': ['1 系列', '2 系列', '3 系列', '5 系列', 'X1', 'X3', 'X5', 'i4', 'iX', 'iX1'],
  'MINI': ['Cooper', 'Countryman', 'Clubman'],
  'Mercedes-Benz 賓士': ['A-Class', 'C-Class', 'E-Class', 'S-Class', 'GLA', 'GLB', 'GLC', 'GLE', 'V-Class', 'EQA', 'EQB', 'EQE'],
  'Volvo 富豪': ['S60', 'S90', 'V60', 'XC40', 'XC60', 'XC90', 'EX30', 'EX40'],
  'Porsche 保時捷': ['Macan', 'Cayenne', 'Panamera', 'Taycan'],
  'Tesla 特斯拉': ['Model 3', 'Model Y', 'Model S', 'Model X'],
  'Luxgen 納智捷': ['S5', 'U5', 'U6', 'URX', 'M7', 'n7'],
  'Peugeot 寶獅': ['208', '2008', '308', '3008', '408', '5008', 'Rifter'],
  'Citroën 雪鐵龍': ['C3', 'C4', 'C5 Aircross', 'C5 X', 'Berlingo'],
  'MG': ['ZS', 'HS', 'MG4'],
  'Land Rover': ['Defender', 'Discovery', 'Discovery Sport', 'Range Rover Evoque', 'Range Rover Velar', 'Range Rover'],
  'Jeep': ['Renegade', 'Compass', 'Cherokee', 'Wrangler'],
  '其他廠牌': []
};
const $ = id => document.getElementById(id);
$('reg-brand').insertAdjacentHTML('beforeend', Object.keys(CARS).map(b => `<option>${b}</option>`).join(''));
function fillModels() {
  const list = CARS[$('reg-brand').value];
  const sel = $('reg-model');
  if (!list) { sel.innerHTML = '<option value="">請先選擇廠牌</option>'; sel.disabled = true; }
  else {
    sel.innerHTML = (list.length ? '<option value="">請選擇車型</option>' : '') + list.map(m => `<option>${m}</option>`).join('') + '<option value="__other">其他（自行輸入）</option>';
    sel.disabled = false;
  }
  $('reg-other-wrap').hidden = sel.value !== '__other';
}
$('reg-brand').addEventListener('change', fillModels);
$('reg-model').addEventListener('change', () => { $('reg-other-wrap').hidden = $('reg-model').value !== '__other'; });
$('reg-seats').addEventListener('change', () => { if ($('reg-seats').value !== '5 人座') $('reg-service').value = '蹦蹦車大型（6 人以上）'; });
$('reg-fuel').addEventListener('change', () => { if ($('reg-fuel').value === '純電動') $('reg-service').value = '蹦蹦車綠能（電動車）'; });

const FRESH = { tab: 'home', status: 'offline', left: SECS, ride: 0, today: 0, trips: 0, offered: 0, accepted: 0 };
let S = { ...FRESH };
let USER = null, MEM = {};
let searchT, countT, riderT, CHAT = [], VOICE = false;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// storage that still works (in memory) when Safari blocks localStorage
const store = {
  get(k) { try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) {} return MEM[k] ?? null; },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) {} }
};

function save() { if (USER) store.set('bbc_stats_' + USER.phone, { today: S.today, trips: S.trips, offered: S.offered, accepted: S.accepted }); }
function loadStats() { const v = store.get('bbc_stats_' + USER.phone) || {}; Object.assign(S, { today: v.today || 0, trips: v.trips || 0, offered: v.offered || 0, accepted: v.accepted || 0 }); }

async function hashPw(phone, pw) {
  const data = new TextEncoder().encode('bbc:' + phone + ':' + pw);
  try { const b = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { return 'plain:' + pw; }
}
const cleanPhone = v => v.replace(/[\s-]/g, '');

function enter(acc) {
  stopTimers(); USER = acc; store.set('bbc_session', acc.phone);
  S = { ...FRESH }; loadStats();
  document.getElementById('auth').hidden = true; render();
}
function showAuth(mode) {
  stopTimers(); USER = null; S = { ...FRESH };
  document.getElementById('profile').hidden = true;
  document.getElementById('auth').hidden = false;
  seg(mode || 'reg'); render();
}
function seg(mode) {
  document.getElementById('seg-reg').setAttribute('aria-selected', mode === 'reg');
  document.getElementById('seg-login').setAttribute('aria-selected', mode === 'login');
  document.getElementById('regForm').hidden = mode !== 'reg';
  document.getElementById('loginForm').hidden = mode !== 'login';
  document.getElementById('regErr').textContent = ''; document.getElementById('loginErr').textContent = '';
}

document.getElementById('regForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('regErr');
  const name = document.getElementById('reg-name').value.trim();
  const phone = cleanPhone(document.getElementById('reg-phone').value);
  const plate = document.getElementById('reg-plate').value.trim().toUpperCase().replace(/\s/g, '');
  const brand = $('reg-brand').value, modelSel = $('reg-model').value;
  const model = modelSel === '__other' ? $('reg-other').value.trim() : modelSel;
  const car = { brand, model, color: $('reg-color').value, seats: $('reg-seats').value, fuel: $('reg-fuel').value, service: $('reg-service').value };
  const pw = document.getElementById('reg-pw').value, pw2 = document.getElementById('reg-pw2').value;
  if (!name) return err.textContent = '請輸入姓名';
  if (!/^09\d{8}$/.test(phone)) return err.textContent = '手機號碼要是 09 開頭的 10 位數字';
  if (!/^[A-Z0-9]{2,4}-[A-Z0-9]{2,4}$/.test(plate)) return err.textContent = '車牌格式例如 ABC-1234，中間要有「-」';
  if (!brand) return err.textContent = '請選擇廠牌';
  if (!model) return err.textContent = modelSel === '__other' ? '請輸入車型' : '請選擇車型';
  if (pw.length < 6) return err.textContent = '密碼至少要 6 碼';
  if (pw !== pw2) return err.textContent = '兩次輸入的密碼不一樣';
  const accounts = store.get('bbc_accounts') || {};
  if (accounts[phone]) return err.textContent = '這個手機號碼已經註冊過，請改用「登入」';
  const acc = { name, phone, plate, ...car, type: car.service, pw: await hashPw(phone, pw) };
  accounts[phone] = acc; store.set('bbc_accounts', accounts);
  e.target.reset(); fillModels(); enter(acc);
});

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('loginErr');
  const phone = cleanPhone(document.getElementById('login-phone').value);
  const pw = document.getElementById('login-pw').value;
  const acc = (store.get('bbc_accounts') || {})[phone];
  if (!acc) return err.textContent = '找不到這個手機號碼，請先註冊';
  if (acc.pw !== await hashPw(phone, pw)) return err.textContent = '密碼不正確，請再試一次';
  e.target.reset(); enter(acc);
});
function set(p) { Object.assign(S, p); save(); render(); }
function stopTimers() { clearTimeout(searchT); clearInterval(countT); clearTimeout(riderT); clearInterval(meterT); }

function search() {
  stopTimers();
  set({ status: 'searching' });
  searchT = setTimeout(() => {
    RIDES[S.ride] = makeRide();
    set({ status: 'request', left: SECS, offered: S.offered + 1 });
    countT = setInterval(() => { S.left <= 1 ? next() : set({ left: S.left - 1 }); }, 1000);
  }, 2500);
}
function next() { stopTimers(); S.ride = (S.ride + 1) % RIDES.length; search(); }

const A = {
  online: search,
  offline: () => { stopTimers(); set({ status: 'offline' }); },
  accept: () => {
    stopTimers(); CHAT = []; S.unread = 0;
    set({ status: 'pickup', accepted: S.accepted + 1 });
    riderT = setTimeout(() => riderSay('你好，我在門口等你，謝謝！'), 5000);
  },
  decline: next,
  arrive: () => { M = { frac: 0, km: 0, min: 0 }; set({ status: 'trip' }); startMeter(); },
  complete: () => {
    clearInterval(meterT);
    const f = Math.max(100, meterFare());
    RIDES[S.ride].fare = f;
    set({ status: 'done', today: S.today + f, trips: S.trips + 1 });
  },
  next: next,
  chat: () => openChat()
};

const LOGO = `<div class="logo"><div class="tile"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16v-3l2.5-4.5h13L21 13v3z"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/><path d="M8 5.5c.8-1 1.6-1 2.4 0M13.6 5.5c.8-1 1.6-1 2.4 0"/></svg></div><div class="word"><span style="color:var(--pink)">蹦</span><span style="color:var(--blue)">蹦</span><span style="color:var(--purple)">車</span></div></div>`;

function sheetHTML() {
  const r = RIDES[S.ride];
  switch (S.status) {
    case 'offline': return `<div class="offline-wrap"><button class="online" data-a="online">上線</button>
      <div class="card center">${LOGO}<p class="h2">${USER ? esc(USER.name) + '，' : ''}您目前離線</p><p class="sub">按「上線」開始接收行程</p></div></div>`;
    case 'searching': return `<div class="card searching"><div class="track"><div class="fill"></div></div>
      <div class="row"><div><p class="h2">正在尋找行程…</p><p class="sub">附近需求：普通</p></div><button class="outline" data-a="offline">下線</button></div></div>`;
    case 'request': return `<div class="req"><div class="row"><div class="chip">${esc((USER && (USER.service || USER.type)) || r.type)}</div><div class="dim">剩 ${S.left} 秒</div></div>
      <div class="track" style="background:#2D3833"><div class="fill" style="width:${S.left / SECS * 100}%;background:var(--yellow);transition:width 1s linear"></div></div>
      <div style="display:flex;align-items:baseline;gap:10px"><div class="fare">NT$${r.fare}</div><div class="dim">預估車資（跳表計費）</div></div>
      <div class="dim" style="font-size:14px">★ ${r.rating} · 距離 ${r.pickupMin} 分鐘（${r.pickupKm} 公里）</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="stop"><div class="dot" style="background:#fff;border-radius:50%"></div><div>${r.from}</div></div>
        <div class="stop"><div class="dot" style="background:var(--yellow)"></div><div>${r.to}<div class="dim" style="font-size:13px">行程約 ${r.tripMin} 分鐘 · ${r.tripKm} 公里</div></div></div>
      </div>
      <div style="display:flex;gap:10px"><button class="decline" data-a="decline" aria-label="拒絕"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="btn" style="background:var(--blue)" data-a="accept">接受</button></div></div>`;
    case 'pickup': return `<div class="card"><div class="kicker">前往上車地點 · ${r.pickupMin} 分鐘</div><p class="h2">${r.from}</p>
      <div style="display:flex;align-items:center;gap:12px"><div class="avatar">${r.rider[0]}</div>
        <div style="flex:1;min-width:0"><div style="font-weight:500">${r.rider}</div><div class="sub" style="font-size:13px">★ ${r.rating}</div></div>
        <button class="round flat" data-a="chat" aria-label="傳訊息給乘客" style="position:relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121A17" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>${badge()}</button>
        <button class="round flat" aria-label="打電話給乘客"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121A17" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/></svg></button>
      </div><button class="btn" style="background:var(--pink)" data-a="arrive">已抵達，開始行程</button></div>`;
    case 'trip': return `<div class="card"><div class="row"><div class="kicker">${M.frac >= 1 ? '已抵達目的地' : '行程中'}</div><div class="kicker" id="mStat">${M.frac >= 1 ? '請向乘客收費' : '剩約 ' + Math.max(1, Math.ceil(r.tripMin - M.min)) + ' 分鐘'}</div></div><p class="h2">${r.to}</p>
      <div class="meter" role="status" aria-label="跳表">
        <div class="meter-top"><span>蹦蹦車跳表</span>${M.frac >= 1 ? '<span>停表</span>' : '<span class="live">計費中</span>'}</div>
        <div class="meter-fare">NT$<span id="mFare">${fmt(meterFare())}</span></div>
        <div class="meter-sub"><span id="mKm">${M.km.toFixed(1)}</span> 公里 · <span id="mMin">${Math.floor(M.min)}</span> 分鐘</div>
        <div class="meter-rate">起跳 50 · 每公里 20 · 每分鐘 2 · 最低 100</div>
      </div><div class="row"><p class="sub">乘客：${r.rider}</p><button class="outline" data-a="chat" style="position:relative">傳訊息${badge()}</button></div>
      <button class="btn" style="background:var(--ink)" data-a="complete">完成行程</button></div>`;
    case 'done': return `<div class="card center" style="gap:8px"><div class="check"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <p class="sub">本趟收入</p><div class="fare">NT$${r.fare}</div><p class="sub">今日累計 NT$${fmt(S.today)} · ${S.trips} 趟</p>
      <button class="btn" style="background:var(--purple);margin-top:8px" data-a="next">繼續接單</button></div>`;
  }
}

function earnHTML() {
  const week = [...PAST, S.today], total = week.reduce((a, b) => a + b, 0);
  const tips = Math.round(total * 0.04), bonus = 600, rate = S.offered ? Math.round(S.accepted / S.offered * 100) : 100;
  return `<div><p class="sub">最近 7 天收入</p><div class="fare">NT$${fmt(total)}</div></div>
    <div class="panel" style="padding-top:20px"><div class="chart">${week.map((v, i) => `<div class="bar"><span>${v ? fmt(v) : ''}</span><i style="height:${Math.max(4, Math.round(v / 3200 * 130))}px;background:${RAINBOW[i]}"></i></div>`).join('')}</div>
    <div class="days">${DAYS.map(d => `<span>${d}</span>`).join('')}</div></div>
    <div class="stats"><div class="stat"><span class="sub" style="font-size:13px">今日行程</span><b style="color:var(--pink)">${S.trips}</b></div>
      <div class="stat"><span class="sub" style="font-size:13px">7 天行程</span><b style="color:var(--blue)">${PAST_TRIPS + S.trips}</b></div>
      <div class="stat"><span class="sub" style="font-size:13px">接單率</span><b style="color:var(--purple)">${rate}%</b></div></div>
    <div class="panel" style="padding-block:6px"><div class="line"><span>行程費用</span><b>NT$${fmt(total - tips - bonus)}</b></div>
      <div class="line"><span>獎勵</span><b>NT$${fmt(bonus)}</b></div><div class="line"><span>小費</span><b>NT$${fmt(tips)}</b></div></div>
    <p class="sub" style="font-size:12px">畫面中的金額為示範資料</p>

    document.querySelectorAll('#areaGrid button').forEach(b => b.setAttribute('aria-pressed', b.dataset.area === AREA));
    $('areaPick').hidden = false;
  }
  if (e.target.closest('#areaClose') || e.target.id === 'areaPick') $('areaPick').hidden = true;

  if (e.target.closest('#voiceBtn')) {
    VOICE = !VOICE; $('voiceBtn').setAttribute('aria-pressed', VOICE);
    if (VOICE) speak('語音朗讀已開啟'); else try { speechSynthesis.cancel(); } catch (err) {}
  }
});

const QUICK = ['我到了，在路邊等您', '大約 3 分鐘到', '請問您穿什麼顏色的衣服？', '路上有點塞車，請稍等', '好的，收到'];
function badge() { return S.unread ? `<span class="badge">${S.unread}</span>` : ''; }
function riderReply(t) {
  if (/到了|路邊/.test(t)) return '好，我馬上出來！';
  if (/顏色|衣服/.test(t)) return '我穿藍色外套，站在便利商店前面';
  if (/塞車/.test(t)) return '沒關係，謝謝告知';
  if (/分鐘|稍等/.test(t)) return '好的，不急，慢慢來';
  if (/收到|好的/.test(t)) return '謝謝司機';
  return '好的，謝謝';
}
function speak(text) {
  if (!VOICE) return;
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (err) {}
}
function renderChat() {
  const box = $('msgs');
  box.innerHTML = CHAT.length
    ? CHAT.map(m => `<div class="msg ${m.me ? 'me' : 'them'}">${esc(m.text)}</div>`).join('')
    : '<p class="sub" style="text-align:center;margin:auto 0">還沒有訊息。點下方的常用語可以快速傳送。</p>';
  box.scrollTop = box.scrollHeight;
}
function openChat() {
  S.unread = 0;
  $('chatName').textContent = RIDES[S.ride].rider;
  $('chat').hidden = false;
  renderChat(); render();
}
function riderSay(text) {
  if (S.status !== 'pickup' && S.status !== 'trip') return;
  CHAT.push({ me: false, text });
  if ($('chat').hidden) { S.unread = (S.unread || 0) + 1; render(); } else renderChat();
  speak(RIDES[S.ride].rider + '說：' + text);
}
function sendMsg(text) {
  text = text.trim(); if (!text) return;
  CHAT.push({ me: true, text }); renderChat();
  clearTimeout(riderT);
  riderT = setTimeout(() => riderSay(riderReply(text)), 1500);
}

const ALL_SPOTS = KHH.flatMap(a => a.p.map(p => ({ d: a.d, n: p[0], c: [p[1], p[2]] })));
const NAMES = ['陳小姐', '林先生', '王小姐', '張先生', '李小姐', '黃先生', '吳小姐', '劉先生', '蔡小姐', '楊先生'];
let AREA = store.get('bbc_area') || '左營區';
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];
function distKm(a, b) {
  const t = Math.PI / 180, dLa = (b[0] - a[0]) * t, dLo = (b[1] - a[1]) * t;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * t) * Math.cos(b[0] * t) * Math.sin(dLo / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}
function makeRide() {
  const pool = AREA === '全高雄' ? ALL_SPOTS : ALL_SPOTS.filter(s => s.d === AREA);
  const from = pickOne(pool);
  const others = ALL_SPOTS.filter(s => s.n !== from.n);
  const near = others.filter(s => distKm(from.c, s.c) < 12);
  const to = Math.random() < 0.75 && near.length ? pickOne(near) : pickOne(others);
  const road = distKm(from.c, to.c) * 1.3;            // 直線距離換算成道路距離
  const tripMin = Math.max(5, Math.round(road / (road > 15 ? 45 : 25) * 60 + 2));
  const pk = 0.4 + Math.random() * 2.4;
  // 車資：起跳 50 元 + 每公里 20 元 + 每分鐘 2 元，最低 100 元（四捨五入到 5 元）
  const fare = Math.max(100, Math.round((50 + road * 20 + tripMin * 2) / 5) * 5);
  return {
    type: '蹦蹦車標準', fare, rating: (4.7 + Math.random() * 0.29).toFixed(2),
    pickupMin: Math.max(1, Math.round(pk / 22 * 60 + 1)), pickupKm: pk.toFixed(1),
    from: `${from.d} ${from.n}`, to: `${to.d} ${to.n}`, tripMin, tripKm: road.toFixed(1), roadKm: road, rider: pickOne(NAMES)
  };
}
// ---- 跳表：起跳 50 元 + 每公里 20 元 + 每分鐘 2 元，每次跳 5 元；結算最低 100 元 ----
var meterT, M = { frac: 0, km: 0, min: 0 };
function meterFare() { return Math.floor((50 + M.km * 20 + M.min * 2) / 5) * 5; }
function startMeter() {
  clearInterval(meterT);
  const r = RIDES[S.ride];
  const road = r.roadKm || parseFloat(r.tripKm) || 3, mins = r.tripMin;
  const seconds = Math.min(45, Math.max(12, mins * 1.2));   // 模擬行駛：實際約 12–45 秒跑完
  meterT = setInterval(() => {
    M.frac = Math.min(1, M.frac + 0.5 / seconds);
    M.km = road * M.frac; M.min = mins * M.frac;
    if (M.frac >= 1 || S.status !== 'trip') { clearInterval(meterT); render(); return; }
    const f = document.getElementById('mFare');
    if (f) {
      f.textContent = fmt(meterFare());
      document.getElementById('mKm').textContent = M.km.toFixed(1);
      document.getElementById('mMin').textContent = Math.floor(M.min);
      document.getElementById('mStat').textContent = '剩約 ' + Math.max(1, Math.ceil(mins - M.min)) + ' 分鐘';
    }
  }, 500);
}
