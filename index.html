<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>蹦蹦車 司機端</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="蹦蹦車">
<meta name="theme-color" content="#E4E8E1">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
*{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}
</style>
<style>
/* Layout: one-screen phone app — map fills the screen, action sheet floats above a bottom tab bar. Single committed light look. */
:root {
  --ink: #121A17; --grey: #5B6560; --line: #DDE2DC; --ground: #E4E8E1; --page: #F6F7F4; --white: #FFFFFF;
  --pink: #D12A6E; --orange: #E8590C; --yellow: #FFC93C; --green: #1F8A3A; --teal: #0E8A9E; --blue: #2459D6; --purple: #7B3FD1;
  --park: #CDE2CC; --water: #BFD7E6; --dim: #C9D2CD;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; cursor: pointer; border: none; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; background: var(--ground); }

/* map */
.map { position: absolute; inset: 0; }
.m { position: absolute; }
.road-h { left: 0; right: 0; height: 10px; background: var(--white); }
.road-v { top: 0; bottom: 0; width: 8px; background: var(--white); }
.lbl { font-size: 11px; color: var(--grey); }
.car { width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: var(--white); display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.route[hidden] { display: none !important; }

/* top bar */
.top { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: 14px; display: flex; align-items: center; justify-content: space-between; }
.round { width: 44px; height: 44px; border-radius: 50%; background: var(--white); display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.round.flat { background: var(--ground); box-shadow: none; }
.pill { height: 44px; padding: 0 18px; border-radius: 22px; background: var(--purple); color: var(--white); display: flex; align-items: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

/* sheet */
.sheet { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.card { background: var(--white); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -2px 16px rgba(0,0,0,.1); }
.card.center { align-items: center; text-align: center; }
.h2 { font-size: 20px; font-weight: 700; margin: 0; }
.sub { font-size: 14px; color: var(--grey); margin: 0; }
.kicker { font-size: 13px; color: var(--grey); font-weight: 500; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.track { height: 4px; border-radius: 2px; background: var(--ground); overflow: hidden; }
.fill { height: 4px; border-radius: 2px; }
.searching .fill { width: 40%; background: var(--blue); animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
@media (prefers-reduced-motion: reduce) { .searching .fill { animation: none; } }

.online { width: 96px; height: 96px; border-radius: 50%; border: 6px solid var(--white); background: var(--pink); color: var(--white); font-size: 22px; font-weight: 900; box-shadow: 0 6px 18px rgba(209,42,110,.4); }
.offline-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.offline-wrap .card { align-self: stretch; }
.btn { height: 56px; border-radius: 28px; color: var(--white); font-size: 18px; font-weight: 700; width: 100%; }
.navbtn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 24px; border: 1.5px solid var(--blue); color: var(--blue); background: var(--white); font-size: 16px; font-weight: 700; text-decoration: none; }
.navbtn:active { background: #E2EAFF; }
.outline { height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid var(--ink); background: var(--white); color: var(--ink); font-size: 15px; font-weight: 700; flex-shrink: 0; }
.btn:active, .online:active { opacity: .85; }

.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: conic-gradient(var(--pink) 0 25%, var(--orange) 0 50%, var(--yellow) 0 75%, var(--blue) 0); }
.word { font-size: 26px; font-weight: 900; letter-spacing: 1px; }

.req { background: var(--ink); color: var(--white); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.3); margin: 0 -4px; }
.chip { height: 28px; padding: 0 12px; border-radius: 14px; background: var(--yellow); color: var(--ink); font-size: 13px; font-weight: 700; display: flex; align-items: center; }
.dim { color: var(--dim); font-size: 15px; }
.fare { font-size: 40px; font-weight: 900; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.stop { display: flex; gap: 12px; align-items: flex-start; }
.dot { width: 10px; height: 10px; margin-top: 7px; flex-shrink: 0; }
.decline { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--grey); background: transparent; display: grid; place-items: center; flex-shrink: 0; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--ground); display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
.check { width: 52px; height: 52px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }

/* earnings */
.earn { position: absolute; inset: 0; background: var(--page); overflow-y: auto; padding-block: 24px calc(110px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.panel { background: var(--white); border-radius: 20px; padding: 16px; }
.chart { height: 160px; display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--line); }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; }
.bar span { font-size: 10px; color: var(--grey); font-variant-numeric: tabular-nums; }
.bar i { display: block; width: 100%; border-radius: 6px 6px 0 0; }
.days { display: flex; gap: 8px; margin-top: 8px; }
.days span { flex: 1; text-align: center; font-size: 12px; color: var(--grey); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--white); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.stat b { font-size: 24px; font-variant-numeric: tabular-nums; }
.line { display: flex; justify-content: space-between; padding: 14px 0; font-size: 15px; border-bottom: 1px solid #EEF0EC; }
.line:last-child { border-bottom: none; }
.line b { font-weight: 500; font-variant-numeric: tabular-nums; }

/* tab bar */
.tabs { position: absolute; left: 0; right: 0; bottom: 0; background: var(--white); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { flex: 1; height: 68px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--grey); }
.tab[aria-selected="true"] { color: var(--pink); }

/* auth */
.auth { position: absolute; inset: 0; z-index: 20; background: var(--page); overflow-y: auto; padding-block: 28px 40px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--ground); border-radius: 14px; padding: 4px; }
.seg button { height: 44px; border-radius: 10px; background: transparent; font-size: 16px; font-weight: 700; color: var(--grey); }
.seg button[aria-selected="true"] { background: var(--white); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.form { display: flex; flex-direction: column; gap: 14px; }
.form[hidden] { display: none !important; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 500; }
.field input, .field select { height: 50px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit; background: var(--white); color: var(--ink); width: 100%; box-sizing: border-box; }
.field input:focus, .field select:focus { outline: none; border-color: var(--blue); }
.err { color: #B3261E; font-size: 14px; min-height: 20px; margin: 0; }
.hint { font-size: 12px; color: var(--grey); margin: 0; line-height: 1.6; }
/* chat */
.chat { position: absolute; inset: 0; z-index: 16; background: var(--page); display: flex; flex-direction: column; }
.chat[hidden] { display: none !important; }
.chat-head { display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--white); border-bottom: 1px solid var(--line); }
.msgs { flex: 1; overflow-y: auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 16px; line-height: 1.45; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--blue); color: var(--white); border-bottom-right-radius: 6px; }
.msg.them { align-self: flex-start; background: var(--white); color: var(--ink); border-bottom-left-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.quick { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.quick button { flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 19px; background: var(--white); border: 1.5px solid var(--line); font-size: 14px; color: var(--ink); }
.compose { display: flex; gap: 8px; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.compose input { flex: 1; min-width: 0; height: 46px; border-radius: 23px; border: 1.5px solid var(--line); padding: 0 16px; font-size: 16px; font-family: inherit; background: var(--white); color: var(--ink); }
.compose input:focus { outline: none; border-color: var(--blue); }
.send { width: 46px; height: 46px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; flex-shrink: 0; }
.voice { height: 38px; padding: 0 12px; border-radius: 19px; background: var(--ground); font-size: 13px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.voice[aria-pressed="true"] { background: var(--pink); color: var(--white); }
.badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: var(--pink); color: var(--white); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* location */
.locchip { position: absolute; top: 68px; left: 50%; transform: translateX(-50%); height: 38px; padding: 0 14px; border-radius: 19px; background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,.12); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.area-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-height: 52vh; overflow-y: auto; padding-bottom: 4px; }
.area-grid button { height: 44px; border-radius: 12px; background: var(--ground); font-size: 15px; font-weight: 500; color: var(--ink); }
.area-grid button.all { grid-column: 1 / -1; font-weight: 700; }
.area-grid button[aria-pressed="true"] { background: var(--pink); color: var(--white); }
/* taxi meter */
.meter { background: var(--ink); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.meter-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--dim); letter-spacing: .08em; }
.meter-fare { color: var(--yellow); font-size: 44px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
.meter-sub { color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
.meter-rate { color: var(--dim); font-size: 11px; opacity: .85; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--yellow); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
.overlay { position: absolute; inset: 0; z-index: 15; background: rgba(18,26,23,.45); display: flex; align-items: flex-end; }
.psheet { width: 100%; background: var(--white); border-radius: 24px 24px 0 0; padding-block: 24px calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 6px; }
#lmap { position: absolute; inset: 0; z-index: 0; background: var(--ground); }
#lmap .leaflet-control-attribution { font-size: 10px; margin-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.top, .locchip, .sheet { z-index: 2; }
.locchip { max-width: calc(100% - 32px); overflow: hidden; }
.locchip span { overflow: hidden; text-overflow: ellipsis; }
.toast { position: absolute; left: 50%; top: calc(116px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30; max-width: calc(100% - 32px); background: var(--ink); color: var(--white); padding: 12px 18px; border-radius: 14px; font-size: 15px; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,.25); text-align: center; }
</style>
</head>
<body>
<div class="app">
  <section id="home">
    <div id="lmap"></div>
    <div class="map" aria-hidden="true">
      <div class="m" style="left:30px;top:150px;width:120px;height:90px;background:var(--park);border-radius:10px"></div>
      <div class="m" style="right:30px;top:420px;width:110px;height:130px;background:var(--park);border-radius:10px"></div>
      <div class="m" style="left:-20px;top:520px;width:220px;height:46px;background:var(--water);transform:rotate(-12deg)"></div>
      <div class="m road-h" style="top:270px;height:14px"></div>
      <div class="m road-h" style="top:400px"></div>
      <div class="m road-h" style="top:600px"></div>
      <div class="m road-v" style="left:46%;width:14px"></div>
      <div class="m road-v" style="left:18%"></div>
      <div class="m road-v" style="left:77%"></div>
      <div class="m lbl" id="mapLbl1" style="left:52%;top:254px"></div>
      <div class="m lbl" id="mapLbl2" style="left:21%;top:386px"></div>
      <div class="route" id="route" hidden>
        <div class="m" style="left:calc(46% + 4px);top:284px;width:6px;height:120px;background:var(--blue);border-radius:3px"></div>
        <div class="m" style="left:calc(46% + 4px);top:400px;width:31%;height:6px;background:var(--blue);border-radius:3px"></div>
        <div class="m" style="left:calc(77% - 10px);top:389px;width:28px;height:28px;border-radius:50%;background:var(--pink);border:4px solid var(--white);box-sizing:border-box"></div>
      </div>
      <div class="m car" style="left:calc(46% + 7px);top:257px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#D12A6E"><path d="M12 2l7 19-7-4-7 4z"/></svg>
      </div>
    </div>

    <div class="top">
      <button class="round" id="profileBtn" aria-label="個人檔案"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121A17" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
      <div class="pill" id="pill">NT$ 0</div>
      <button class="round" id="myLocBtn" aria-label="回到我的位置"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2459D6" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="#2459D6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>

    <div class="locchip" id="locBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D12A6E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span id="locText">高雄市全區</span>
    </div>
    <div class="sheet" id="sheet" aria-live="polite"></div>
  </section>

  <section class="earn" id="earn" hidden></section>
  <section class="earn" id="points" hidden></section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-home" aria-selected="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>首頁
    </button>
    <button class="tab" role="tab" id="tab-earn" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>收入
    </button>
    <button class="tab" role="tab" id="tab-points" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.5-.9-1.6-1.4-2.8-1.4-1.6 0-2.8.9-2.8 2.1s1.1 1.7 2.8 2.1 2.8.9 2.8 2.1-1.2 2.1-2.8 2.1c-1.3 0-2.4-.6-2.9-1.5M12 6v1.8M12 16.2V18"/></svg>點數
    </button>
  </nav>

  <section class="auth" id="auth" hidden>
    <div id="authLogo" style="display:flex;justify-content:center;margin-top:8px"></div>
    <p class="sub" style="text-align:center;margin-top:-10px">司機專用帳號</p>
    <div class="seg" role="tablist">
      <button role="tab" id="seg-login" aria-selected="true">登入</button>
      <button role="tab" id="seg-reg" aria-selected="false">註冊</button>
    </div>
    <form class="form" id="loginForm" novalidate>
      <div class="field"><label for="login-phone">手機號碼</label><input id="login-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0912345678"></div>
      <div class="field"><label for="login-pw">密碼</label><input id="login-pw" type="password" autocomplete="current-password"></div>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn" type="submit" style="background:var(--blue)">登入</button>
    </form>
    <form class="form" id="regForm" novalidate hidden>
      <div class="field"><label for="reg-name">姓名</label><input id="reg-name" autocomplete="name" placeholder="王小明"></div>
      <div class="field"><label for="reg-phone">手機號碼</label><input id="reg-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0912345678"></div>
      <div class="field"><label for="reg-plate">車牌號碼</label><input id="reg-plate" autocapitalize="characters" placeholder="ABC-1234"></div>
      <div class="field"><label for="reg-brand">廠牌</label><select id="reg-brand"><option value="">請選擇廠牌</option></select></div>
      <div class="field"><label for="reg-model">車型</label><select id="reg-model" disabled><option value="">請先選擇廠牌</option></select></div>
      <div class="field" id="reg-other-wrap" hidden><label for="reg-other">輸入車型</label><input id="reg-other" placeholder="例如 Corolla Altis"></div>
      <div class="field"><label for="reg-color">車身顏色</label><select id="reg-color"><option>白色</option><option>黑色</option><option>銀色</option><option>灰色</option><option>黃色</option><option>藍色</option><option>紅色</option><option>其他顏色</option></select></div>
      <div class="field"><label for="reg-seats">座位數</label><select id="reg-seats"><option>5 人座</option><option>7 人座</option><option>8 人座以上</option></select></div>
      <div class="field"><label for="reg-fuel">動力</label><select id="reg-fuel"><option>汽油</option><option>油電混合</option><option>插電式油電</option><option>純電動</option><option>柴油</option></select></div>
      <div class="field"><label for="reg-service">服務類型</label><select id="reg-service"><option>蹦蹦車標準</option><option>蹦蹦車舒適</option><option>蹦蹦車大型（6 人以上）</option><option>蹦蹦車綠能（電動車）</option><option>蹦蹦車無障礙</option></select></div>
      <div class="field"><label for="reg-pw">密碼（至少 6 碼）</label><input id="reg-pw" type="password" autocomplete="new-password"></div>
      <div class="field"><label for="reg-pw2">再次輸入密碼</label><input id="reg-pw2" type="password" autocomplete="new-password"></div>
      <p class="err" id="regErr" role="alert"></p>
      <button class="btn" type="submit" style="background:var(--pink)">建立帳號</button>
    </form>
    <p class="hint" id="modeHint"></p>
  </section>

  <section class="chat" id="chat" hidden aria-label="和乘客聊天">
    <div class="chat-head">
      <button class="round flat" id="chatClose" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121A17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:17px" id="chatName"></div><div class="sub" style="font-size:12px">示範：乘客為自動回覆</div></div>
      <button class="voice" id="voiceBtn" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>朗讀訊息</button>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="quick" id="quick"></div>
    <form class="compose" id="chatForm">
      <label for="chatInput" class="sr">輸入訊息</label>
      <input id="chatInput" placeholder="輸入訊息…" autocomplete="off">
      <button class="send" type="submit" aria-label="傳送"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button>
    </form>
  </section>

  <div class="overlay" id="tripDetail" hidden>
    <div class="psheet" role="dialog" aria-label="行程明細" style="gap:10px;max-height:88%;overflow-y:auto">
      <div class="row"><div><p class="h2">行程明細</p><p class="sub" id="tdState" style="font-size:12px"></p></div>
        <button class="round flat" id="tdClose" aria-label="關閉"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121A17" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div id="tdBody"></div>
    </div>
  </div>

  <div class="overlay" id="profile" hidden>
    <div class="psheet" role="dialog" aria-label="個人檔案">
      <div class="row" style="margin-bottom:6px"><p class="h2" id="pfName"></p>
        <button class="round flat" id="pfClose" aria-label="關閉"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121A17" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="line"><span>手機號碼</span><b id="pfPhone"></b></div>
      <div class="line"><span>車牌號碼</span><b id="pfPlate"></b></div>
      <div class="line"><span>車輛</span><b id="pfCar"></b></div>
      <div class="line"><span>規格</span><b id="pfSpec"></b></div>
      <div class="line"><span>服務類型</span><b id="pfType"></b></div>
      <div class="line"><span>連線模式</span><b id="pfMode"></b></div>
      <button class="btn" id="logout" style="background:var(--ink);margin-top:10px">登出</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

</body>
